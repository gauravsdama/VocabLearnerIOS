name: iOS Build And Submit

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit the production build to App Store Connect"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: macos-15
    env:
      APP_VARIANT: production
      IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
      APP_VERSION: ${{ vars.APP_VERSION }}
      IOS_BUILD_NUMBER: ${{ vars.IOS_BUILD_NUMBER }}
      IOS_SUPPORTS_TABLET: ${{ vars.IOS_SUPPORTS_TABLET }}
      SUPPORT_URL: ${{ vars.SUPPORT_URL }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      EXPO_ASC_API_KEY_PATH: ${{ secrets.EXPO_ASC_API_KEY_PATH }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.EXPO_APPLE_TEAM_TYPE }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9.0.0
        with:
          eas-version: 24.6.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify tests, types, and production dependencies
        run: npm run release:verify

      - name: Generate required store assets
        run: npm run assets:generate

      - name: Validate App Store screenshots
        run: npm run screenshots:validate

      - name: Build iOS production
        if: ${{ inputs.submit == 'false' }}
        run: eas build --platform ios --profile production --non-interactive

      - name: Build and submit iOS production
        if: ${{ inputs.submit == 'true' }}
        run: eas build --platform ios --profile production --non-interactive --auto-submit
